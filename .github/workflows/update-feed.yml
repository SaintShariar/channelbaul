name: Update full feed

on:
  schedule:
    # Daily ~09:17 UTC
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh YouTube, Instagram list, and news
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_feed.py --mode full
      - name: Commit feed.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json instagram-own.json
          if git diff --staged --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "Auto-refresh YouTube and Channelbaul feed"
          git push
